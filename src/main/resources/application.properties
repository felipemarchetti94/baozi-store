spring.application.name=baozi-store
server.port=8080

# ===== H2 (padrão - não precisa instalar nada) =====
spring.datasource.url=jdbc:h2:mem:baozidb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== MySQL (alternativa) - descomente e comente o bloco do H2 =====
# spring.datasource.url=jdbc:mysql://localhost:3306/baozi_store?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
# spring.datasource.username=root
# spring.datasource.password=SUA_SENHA
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
